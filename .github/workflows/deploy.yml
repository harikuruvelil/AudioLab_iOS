name: Deploy PWA to GitHub Pages

on:
  push:
    branches:
      - main          # adjust if your default branch is named differently
  workflow_dispatch:  # allow manual trigger from the Actions tab

# Grant the GITHUB_TOKEN the permissions needed to push to gh-pages
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the full monorepo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Node (matches your local toolchain)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dev_2.0_music-slowing-pwa/package-lock.json

      # 3. Install dependencies inside the PWA sub-folder
      - name: Install dependencies
        working-directory: dev_2.0_music-slowing-pwa
        run: npm ci

      # 4. Build — GITHUB_PAGES=true tells vite.config.ts to use /AudioLab_iOS/ as base
      - name: Build
        working-directory: dev_2.0_music-slowing-pwa
        env:
          GITHUB_PAGES: "true"
        run: npm run build

      # 5. Deploy only the dist/ folder to the gh-pages branch
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dev_2.0_music-slowing-pwa/dist
          # Optional: keep a clean branch on every deploy
          force_orphan: true
